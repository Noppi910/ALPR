            { id: 4, dateStr: "2026-09-24", jour: "Jeudi", title: "MEYSSIEZ", deptStr: "Isère", codeDept: "38440", km: 10.7, denivele: 250, lyonDist: 50, time: "10 H 00", rdv: "10 H Parking de l'Eglise", organizers: "Denis GADOIN / Alain DAMET", phones: "07 70 38 81 13 / 06 95 07 12 30", repas: "Non" },
            { id: 5, dateStr: "2026-10-01", jour: "Jeudi (Matin)", title: "Refuge de la Jasserie (Pilat)", deptStr: "Loire", codeDept: "42", km: 14.0, denivele: 500, lyonDist: 78, time: "10 H 00", rdv: "10 H Parking de la Jasserie", organizers: "Martine GARCIA / Pascal BERNARD", phones: "06 30 84 97 04 / 07 86 95 84 61", repas: "Non" },
            { id: 6, dateStr: "2026-10-01", jour: "Jeudi (Après-midi)", title: "St NIZIER LE DESERT", deptStr: "Ain", codeDept: "01320", km: 11.8, denivele: 15, lyonDist: 50, time: "13 H 00", rdv: "13 H Parking Camping de la Nizière", organizers: "Jeanne Marie CHARON / Béatrice CHABROL / Christine VIVONA", phones: "06 73 08 29 71 / 06 87 51 66 71 / 06 62 91 14 64", repas: "Non" },
            { id: 7, dateStr: "2026-10-08", jour: "Jeudi (Matin)", title: "BIBOST", deptStr: "Rhône", codeDept: "69690", km: 13.0, denivele: 400, lyonDist: 30, time: "09 H 00", rdv: "9 H Parking Salle des Fêtes", organizers: "Sylvie MARET / François MILLET", phones: "06 43 75 61 83 / 06 07 34 14 16", repas: "Non" },
            { id: 8, dateStr: "2026-10-08", jour: "Jeudi (Après-midi)", title: "CHESSY LES MINES", deptStr: "Rhône", codeDept: "69380", km: 9.5, denivele: 200, lyonDist: 28, time: "13 H 00", rdv: "13 H Parking Mairie", organizers: "Jacqueline et Bernard VULLIEZ", phones: "06 82 27 27 94", repas: "Non" },
            { id: 9, dateStr: "2026-10-15", jour: "Jeudi", title: "CREMIEU", deptStr: "Isère", codeDept: "38560", km: 10.0, denivele: 200, lyonDist: 50, time: "13 H 00", rdv: "13 H Parking du monument aux Morts", organizers: "Gérard PERROUD", phones: "06 67 03 10 86", repas: "Non" },
            { id: 10, dateStr: "2026-10-22", jour: "Jeudi", title: "CHATILLON SUR CHALARONNE", deptStr: "Ain", codeDept: "01400", km: 12.0, denivele: 60, lyonDist: 56, time: "13 H 30", rdv: "13 H 30 Parking face Office de Tourisme", organizers: "Catherine ALVAN", phones: "06 72 36 85 58", repas: "Non" },
            { id: 11, dateStr: "2026-10-29", jour: "Jeudi", title: "SALLES-ARBUISSONNAS", deptStr: "Rhône", codeDept: "69460", km: 10.0, denivele: 200, lyonDist: 47, time: "13 H 00", rdv: "13 H Parking Salle des Fêtes 253 rue du Breuil", organizers: "Martine LEMARCHANDS / Françoise PARDO", phones: "06 07 30 65 07 / 06 87 94 34 45", repas: "Non" },
            { id: 12, dateStr: "2026-11-05", jour: "Jeudi", title: "SOLAIZE", deptStr: "Rhône", codeDept: "69360", km: 11.5, denivele: 210, lyonDist: 20, time: "13 H 00", rdv: "13 H Parking 103 rue des Merles", organizers: "Corinne ABDESSEMED", phones: "07 70 21 06 23", repas: "Non" },
            { id: 13, dateStr: "2026-11-12", jour: "Jeudi", title: "CHASSELAY", deptStr: "Rhône", codeDept: "69380", km: 9.0, denivele: 360, lyonDist: 30, time: "13 H 00", rdv: "13 H Parking Rue Dodat", organizers: "Sabine DELAGARDE / Jean Louis BODIN", phones: "06 77 73 57 01 / 06 51 50 20 26", repas: "Non" },
            { id: 14, dateStr: "2026-11-19", jour: "Jeudi", title: "CHAPONOST", deptStr: "Rhône", codeDept: "69630", km: 11.0, denivele: 130, lyonDist: 13, time: "13 H 00", rdv: "13 H Parking du Cimetière", organizers: "Pascal BERNARD / Marie Lise KRUMENACKER", phones: "07 86 95 84 61 / 06 51 56 03 61", repas: "Non" },
            { id: 15, dateStr: "2026-11-26", jour: "Jeudi", title: "COL DE MALVAL", deptStr: "Rhône", codeDept: "69690", km: 10.0, denivele: 285, lyonDist: 25, time: "13 H 30", rdv: "13 H 30 Parking du Col", organizers: "Yves MABILON / Jean Jacques MICHAUD", phones: "06 52 64 64 34 / 06 08 58 22 29", repas: "Non" },
            { id: 16, dateStr: "2026-12-03", jour: "Jeudi", title: "SATHONAY CAMP", deptStr: "Rhône", codeDept: "69580", km: 10.5, denivele: 150, lyonDist: 15, time: "13 H 00", rdv: "13 H Parking du Haut de la Combe", organizers: "Marius LOURDIN / Germaine PERRAULT", phones: "06 88 61 71 29 / 06 46 57 55 98", repas: "Non" },
            { id: 17, dateStr: "2026-12-10", jour: "Jeudi", title: "Lac de ST QUENTIN FALAVIER", deptStr: "Isère", codeDept: "38070", km: 10.0, denivele: 170, lyonDist: 35, time: "13 H 00", rdv: "13 H Le Point de départ sera précisé ultérieurement par les organisateurs", organizers: "Michel LOSCOS / Eric LOSCOS", phones: "06 09 59 77 84 / 06 78 98 51 60", repas: "Non" },
            { id: 18, dateStr: "2026-12-17", jour: "Jeudi", title: "POMMIERS — Rando & Repas Fin d'Année", deptStr: "Rhône", codeDept: "69480", km: 7.5, denivele: 230, lyonDist: 37, time: "09 H 00", rdv: "9 H Parking près maison des associations", organizers: "Michel LEVY / Jacky LIBAUD", phones: "06 29 01 60 25 / 07 61 62 28 21", repas: "Oui" }
        ];

        let hikesData = [...fallbackHikesData];
        let currentFilteredHikes = [...hikesData];
        let activeHikeIndex = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchAppsScriptJSON();
            populateDropdown();
            renderActiveHike();

            // Rafraîchissement automatique toutes les 60 secondes
            setInterval(async () => {
                await fetchAppsScriptJSON();
                populateDropdown();
                renderActiveHike();
            }, 60000);
        });

        async function fetchAppsScriptJSON() {
            if (!APPS_SCRIPT_URL) return;

            try {
                // Ajout de ?t=Date.now() pour éviter le cache
                const targetUrl = `${APPS_SCRIPT_URL}${APPS_SCRIPT_URL.includes('?') ? '&' : '?'}_t=${Date.now()}`;
                
                const response = await fetch(targetUrl, { 
                    method: 'GET',
                    redirect: 'follow', 
                    cache: 'no-store' 
                });
                
                if (response.ok) {
                    const jsonData = await response.json();
                    if (Array.isArray(jsonData) && jsonData.length > 0) {
                        hikesData = jsonData.map((item, index) => ({
                            id: index + 1,
                            dateStr: item.Date ? String(item.Date).substring(0, 10) : '',
                            jour: item.Jour || '',
                            title: item.Titre || '',
                            deptStr: item.Departement || '',
                            codeDept: item['Code Dept'] || '',
                            km: parseFloat(String(item['Distance (km)'] || 0).replace(',', '.')) || 0,
                            denivele: parseInt(item['Denivele (m)'] || 0) || 0,
                            lyonDist: parseInt(item['Distance Lyon (km)'] || 0) || 0,
                            time: item.Heure || '',
                            rdv: item['Rendez-vous'] || '',
                            organizers: item.Organisateurs || '',
                            phones: item['Telephone Organisateurs'] || '',
                            repas: item['Repas Special'] || 'Non',
                            isSpecialMeal: (item['Repas Special'] && String(item['Repas Special']).toLowerCase().includes('oui'))
                        }));
                        currentFilteredHikes = [...hikesData];
                    }
                }
            } catch (error) {
                console.error('Erreur lors de la récupération des données JSON Apps Script, utilisation des données locales:', error);
            }
        }

        function getFormattedDateDisplay(hike) {
            if (!hike.dateStr) return '';
            const parts = hike.dateStr.split('-');
            let formattedDate = hike.dateStr;
            if (parts.length === 3) {
                formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            const sameDateHikes = currentFilteredHikes.filter(h => h.dateStr === hike.dateStr);
            if (sameDateHikes.length > 1) {
                const jourText = (hike.jour || '').toLowerCase();
                if (jourText.includes('matin')) {
                    return `${formattedDate} (Matin)`;
                } else if (jourText.includes('après-midi') || jourText.includes('apres-midi')) {
                    return `${formattedDate} (Après-midi)`;
                } else {
                    const idxInDay = sameDateHikes.indexOf(hike);
                    return idxInDay === 0 ? `${formattedDate} (Matin)` : `${formattedDate} (Après-midi)`;
                }
            }
            return formattedDate;
        }

        function populateDropdown() {
            const select = document.getElementById('hike-select');
            select.innerHTML = '';

            currentFilteredHikes.forEach((hike, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                const displayDate = getFormattedDateDisplay(hike);
                opt.textContent = `${displayDate} - ${hike.title}`;
                select.appendChild(opt);
            });

            select.value = activeHikeIndex;
        }

        function selectHikeFromDropdown(val) {
            if (val === "") return;
            activeHikeIndex = parseInt(val);
            renderActiveHike();
        }

        function navigateHike(direction) {
            if (currentFilteredHikes.length === 0) return;
            const newIndex = activeHikeIndex + direction;
            if (newIndex >= 0 && newIndex < currentFilteredHikes.length) {
                activeHikeIndex = newIndex;
                document.getElementById('hike-select').value = activeHikeIndex;
                renderActiveHike();
            }
        }

        function renderActiveHike() {
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');

            if (currentFilteredHikes.length === 0) return;

            const hike = currentFilteredHikes[activeHikeIndex];

            prevBtn.disabled = (activeHikeIndex === 0);
            nextBtn.disabled = (activeHikeIndex === currentFilteredHikes.length - 1);

            document.getElementById('card-title').textContent = hike.title;
            document.getElementById('card-date-badge').textContent = getFormattedDateDisplay(hike);
            document.getElementById('card-dept-badge').textContent = `${hike.deptStr} (${hike.codeDept})`;
            
            document.getElementById('card-km').textContent = `${hike.km} km`;
            document.getElementById('card-deniv').textContent = `+${hike.denivele} m`;
            document.getElementById('card-lyondist').textContent = `${hike.lyonDist} km`;

            document.getElementById('card-time').textContent = hike.time;
            document.getElementById('card-rdv').textContent = hike.rdv;

            const mealBanner = document.getElementById('meal-banner');
            if (hike.isSpecialMeal) {
                mealBanner.classList.remove('hidden');
            } else {
                mealBanner.classList.add('hidden');
            }

            const orgsList = document.getElementById('card-organizers-list');
            orgsList.innerHTML = '';
            
            let orgNames = hike.organizers ? String(hike.organizers).split('/').map(s => s.trim()) : [];
            let orgPhones = hike.phones ? String(hike.phones).split('/').map(s => s.trim()) : [];

            let expandedNames = [];
            let expandedPhones = [];

            orgNames.forEach((nameBlock, bIdx) => {
                let subNames = nameBlock.split('&').map(s => s.trim());
                subNames.forEach(n => {
                    expandedNames.push(n);
                    expandedPhones.push(orgPhones[bIdx] || orgPhones[0] || '');
                });
            });

            if (expandedNames.length === 0) {
                orgsList.innerHTML = '<span class="text-slate-400 text-[10px]">Aucun organisateur</span>';
            } else {
                expandedNames.forEach((name, idx) => {
                    const phone = expandedPhones[idx] || '';
                    const rawPhone = phone ? phone.replace(/\s+/g, '') : '';
                    
                    const orgRow = document.createElement('div');
                    orgRow.className = "flex items-center justify-between p-2.5 bg-white rounded-xl border border-slate-200 text-xs gap-2";
                    
                    orgRow.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <span class="font-bold text-slate-800 block truncate">${name}</span>
                        </div>
                        ${phone ? `
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <a href="tel:${rawPhone}" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold rounded-lg border border-sky-200 transition text-xs flex items-center gap-1 shadow-2xs" title="Appeler">
                                <i class="fa-solid fa-phone text-sm"></i>
                                <span>Appeler</span>
                            </a>
                            <a href="sms:${rawPhone}" class="px-3 py-1.5 bg-forest-50 hover:bg-forest-100 text-forest-700 font-bold rounded-lg border border-forest-200 transition text-xs flex items-center gap-1 shadow-2xs" title="SMS">
                                <i class="fa-solid fa-comment-sms text-sm"></i>
                                <span>SMS</span>
                            </a>
                        </div>` : '<span class="text-slate-400 text-[10px]">N/A</span>'}
                    `;
                    orgsList.appendChild(orgRow);
                });
            }

            const gpsBtn = document.getElementById('card-gps-btn');
            gpsBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hike.title + ' ' + hike.deptStr)}`;
        }
    </script>
</body>
</html>
